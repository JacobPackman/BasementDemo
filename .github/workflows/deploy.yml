name: Build and Deploy to Azure Container Apps

# Build once with an immutable tag, stage at 0% traffic, smoke test the
# revision-specific FQDN, then flip traffic. Rollback = traffic shift.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'infra/**'
  workflow_dispatch:

# OIDC: id-token:write lets azure/login mint a short-lived federated token.
# No AZURE_CREDENTIALS secret is ever stored.
permissions:
  id-token: write
  contents: read

# Names come from GitHub repository *variables*, populated from the Bicep
# outputs by infra/setup-oidc.sh. ACR in particular MUST be dynamic -- its name
# embeds a uniqueString hash and cannot be hardcoded here.
env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  # ------------------------------------------------------------------
  # 1. BUILD + PUSH to ACR
  # ------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag to commit SHA
        id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          # The bootstrap writes these as repository VARIABLES, not secrets.
          # Fall back gracefully so either placement works.
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      # az acr login uses the AAD token from the step above -- no admin
      # credentials on the registry, so nothing to leak or rotate.
      - name: Log in to ACR (AAD, no admin creds)
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (SHA tag + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 2. STAGE -- new revision lands at 0% traffic
  # ------------------------------------------------------------------
  stage:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      revision_fqdn: ${{ steps.deploy.outputs.revision_fqdn }}
      revision_name: ${{ steps.deploy.outputs.revision_name }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          # The bootstrap writes these as repository VARIABLES, not secrets.
          # Fall back gracefully so either placement works.
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      # ACA's default (`traffic: [{latestRevision: true}]`) sends 100% of
      # traffic to the NEWEST revision the moment it is created -- the opposite
      # of staging. So capture who is live now, deploy, then explicitly pin
      # traffic back to the old revision so the new one truly sits at 0%.
      - name: Capture the currently-live revision
        id: prev
        run: |
          set -euo pipefail
          PREV=$(az containerapp revision list \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query '[?properties.trafficWeight==`100`].name | [0]' -o tsv)
          if [ -z "$PREV" ] || [ "$PREV" = "null" ]; then
            echo "No revision is currently serving traffic (first deploy)."
            PREV=""
          else
            echo "Currently live: ${PREV}"
          fi
          echo "revision=${PREV}" >> "$GITHUB_OUTPUT"

      # Traffic is pinned to a named revision, so this new revision comes up
      # at 0% and takes no customer traffic until promote runs.
      - name: Deploy new revision
        id: deploy
        run: |
          set -euo pipefail
          SUFFIX="rev-${{ needs.build.outputs.image_tag }}"

          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}" \
            --revision-suffix "$SUFFIX" \
            --output none

          APP_FQDN=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "revision_name=${{ env.AZURE_CONTAINER_APP }}--${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "revision_fqdn=${{ env.AZURE_CONTAINER_APP }}--${SUFFIX}.${APP_FQDN#*.}" >> "$GITHUB_OUTPUT"

      - name: Pin traffic back to the previous revision (new one goes to 0%)
        if: steps.prev.outputs.revision != ''
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --revision-weight "${{ steps.prev.outputs.revision }}=100"
          echo "Traffic pinned to ${{ steps.prev.outputs.revision }}; new revision at 0%."

      - name: Confirm the staged revision carries no traffic
        run: |
          set -euo pipefail
          az containerapp revision list \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[].{name:name, traffic:properties.trafficWeight, health:properties.healthState}" \
            -o table

  # ------------------------------------------------------------------
  # 3. SMOKE TEST the new revision directly, before customers see it
  # ------------------------------------------------------------------
  smoke:
    needs: [build, stage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the staged revision is healthy
        run: |
          set -euo pipefail
          URL="https://${{ needs.stage.outputs.revision_fqdn }}/health"
          echo "Probing $URL"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$URL" | grep -q '"status":"healthy"'; then
              echo "PASS: staged revision is healthy"
              exit 0
            fi
            echo "attempt $i/20 not ready (cold start), retrying in 6s..."
            sleep 6
          done
          echo "FAIL: staged revision never reported healthy"
          exit 1

  # ------------------------------------------------------------------
  # There is deliberately NO auto-promote job here.
  #
  # Promotion is a separate, manually-triggered workflow (promote.yml).
  # Pushing to main builds, stages at 0% traffic, and smoke tests -- then
  # STOPS. A human decides when customers see the new revision.
  #
  # Why not GitHub's "required reviewers" environment gate? It is a paid-plan
  # feature: on a private repo, GitHub Free rejects it with
  #   HTTP 422 "Please ensure the billing plan supports the required
  #   reviewers protection rule."
  # A workflow_dispatch workflow gives the same human gate on a free plan,
  # and works identically on a paid one.
  # ------------------------------------------------------------------
  staged:
    needs: [build, stage, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### Staged, not promoted :hourglass:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ needs.build.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`${{ needs.stage.outputs.revision_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: passed on the revision-specific FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Serving **0% of traffic**. Customers are unaffected." >> "$GITHUB_STEP_SUMMARY"
          echo "Run the **Promote** workflow to shift traffic." >> "$GITHUB_STEP_SUMMARY"
