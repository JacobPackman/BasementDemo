name: Promote Staged Revision

# The human gate. Push to main stages a revision at 0% traffic and smoke tests
# it, then stops. Run THIS workflow to send real traffic to it.
#
# Replaces GitHub's "required reviewers" environment gate, which is a paid-plan
# feature and is rejected on private repos under GitHub Free (HTTP 422).
# Behaviour is otherwise identical: nothing reaches customers without a human.

on:
  workflow_dispatch:
    inputs:
      revision_name:
        description: 'Revision to promote. Leave blank for the newest revision.'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show all revisions
        run: |
          az containerapp revision list \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight, created:properties.createdTime, healthy:properties.healthState}" \
            -o table

      - name: Resolve target revision
        id: target
        run: |
          set -euo pipefail
          REV="${{ inputs.revision_name }}"
          if [ -z "$REV" ]; then
            REV=$(az containerapp revision list \
              --name "${{ env.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "sort_by([?properties.active], &properties.createdTime)[-1].name" -o tsv)
            echo "No revision given; newest active revision is ${REV}"
          fi
          echo "revision=${REV}" >> "$GITHUB_OUTPUT"

      - name: Verify the target is actually serving before promoting
        run: |
          set -euo pipefail
          REV="${{ steps.target.outputs.revision }}"

          show() {
            az containerapp revision show \
              --name "${{ env.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --revision "$REV" --query "$1" -o tsv
          }

          # State strings are ADVISORY. The live probe below is the real gate.
          #
          # Gating on an exact state string has now broken this workflow twice
          # in opposite directions:
          #   - healthState == 'Healthy' refused revisions that legitimately
          #     report 'None' (infra-deploy / manual-update revisions)
          #   - runningState == 'Running' refused 'RunningAtMaxScale', which is
          #     a perfectly healthy state (running at max replica count)
          #
          # Values observed live and all acceptable:
          #   runningState      : Running | RunningAtMaxScale
          #   provisioningState : Provisioned
          #   healthState       : Healthy | None
          #
          # So only fail on states that are unambiguously bad, and let a real
          # 200 from the revision's own /health decide.
          RUNNING=$(show properties.runningState)
          PROV=$(show properties.provisioningState)
          HEALTH=$(show properties.healthState)
          echo "runningState=${RUNNING} provisioningState=${PROV} healthState=${HEALTH}"

          case "${RUNNING}" in
            Running*) ;;   # Running, RunningAtMaxScale, ...
            Stopped|Failed|Degraded|Processing)
              echo "::error::Revision ${REV} is not serving (runningState='${RUNNING}'). Refusing to promote."
              exit 1
              ;;
            *)
              echo "::warning::Unexpected runningState '${RUNNING}'; deferring to the live probe."
              ;;
          esac

          # NOTE: use `if`, not `[ ... ] && echo`. Under `set -e`, the && form
          # returns non-zero when the test is FALSE (i.e. the healthy case) and
          # would abort the step.
          if [ "${PROV}" != "Provisioned" ]; then
            echo "::warning::provisioningState is '${PROV}', not 'Provisioned'."
          fi
          if [ "${HEALTH}" != "Healthy" ]; then
            echo "::warning::healthState is '${HEALTH}', not 'Healthy'."
          fi
          echo "State strings are advisory; the live probe is authoritative."

          APP_FQDN=$(az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          REV_FQDN="${REV}.${APP_FQDN#*.}"
          echo "Probing https://${REV_FQDN}/health"

          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://${REV_FQDN}/health" | grep -q '"status":"healthy"'; then
              echo "PASS: ${REV} is serving healthy responses"
              exit 0
            fi
            echo "attempt $i/20 not ready, retrying in 6s..."
            sleep 6
          done
          echo "::error::Revision ${REV} never returned a healthy response"
          exit 1

      - name: Shift 100% of traffic
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            --name "${{ env.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --revision-weight "${{ steps.target.outputs.revision }}=100"

      - name: Summary
        run: |
          echo "### Promoted :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`${{ steps.target.outputs.revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Traffic: 100%" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: run the **Rollback** workflow against the previous revision." >> "$GITHUB_STEP_SUMMARY"
